{% extends "base.html" %}
{% block title %}{{ code }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="empty-state" style="margin-top:var(--space-10)">
  <div class="metric-value muted" style="font-size:44px;line-height:1">{{ code }}</div>
  <div class="empty-title" style="margin-top:var(--space-2)">
    {{ '页面不存在' if code == 404 else '服务器内部错误' }}
  </div>
  <p class="empty-desc">{{ message }}</p>
  <a class="btn btn-primary" href="/">返回概览</a>
</div>
{% endblock %}

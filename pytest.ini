[pytest]
testpaths = tests
# The default run is offline and deterministic. `live` marks the handful of
# tests that call a real vendor API with a real credential: they cost money,
# depend on the open web, and must never gate an ordinary test run - but they
# stay in the suite because they are the only thing that can catch a vendor
# changing its API out from under us.
#
# Run them deliberately:  pytest -m live
addopts = -m "not live"
markers =
    live: hits a real external API with a real credential (opt-in)

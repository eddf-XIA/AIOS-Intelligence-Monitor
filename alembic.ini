# Alembic configuration for AIOS Intelligence Monitor.
#
# The application stamps a fresh database at head automatically, so you only
# need Alembic when changing the schema:
#
#   alembic revision --autogenerate -m "add x"
#   alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
# Overridden at runtime by aios.database; this value is the CLI default.
sqlalchemy.url = sqlite:///data/aios.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
